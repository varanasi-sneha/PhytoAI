<div class="modal" id="authModal">

<div class="modal-content">

<span class="close" id="closeAuth">×</span>

<!-- LOGIN -->

<div id="loginForm">
    <h2>🌿 Welcome Back</h2>
    <p>Login to continue using PhytoAI</p>

    <div class="form-group">
        <input id="loginEmail" type="email" placeholder="Email" required>
    </div>
    <div class="form-group">
        <input id="loginPassword" type="password" placeholder="Password" required>
    </div>

    <button id="loginSubmit" class="auth-btn">Login</button>

    <p class="auth-switch">
        Don't have an account? <span id="showSignup">Sign up</span>
    </p>
</div>

<!-- SIGNUP -->

<div id="signupForm" style="display:none;">
    <h2>🌱 Join PhytoAI</h2>
    <p>Create your account to get started !!</p>

    <div class="form-group">
        <input id="signupName" type="text" placeholder="Full Name" required>
    </div>
    <div class="form-group">
        <input id="signupEmail" type="email" placeholder="Email" required>
    </div>
    <div class="form-group">
        <input id="signupPassword" type="password" placeholder="Password" required>
    </div>

    <button id="signupSubmit" class="auth-btn">Create Account</button>

    <p class="auth-switch">
        Already have an account? <span id="showLogin">Login</span>
    </p>
</div>

</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
